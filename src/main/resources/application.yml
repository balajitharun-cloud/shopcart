server:
  port: ${PORT:8080}

spring:
  application:
    name: shopcart
  datasource:
    # H2 by default; point SPRING_DATASOURCE_URL at PostgreSQL/MySQL in production.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/shopcart}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,https://balajitharun-cloud.github.io}
  pricing:
    tax-rate: 0.18
    free-shipping-limit: 999.00
    shipping-charge: 79.00
  auth:
    max-login-attempts: 3
    lock-minutes: 15
    session-hours: 24
  store:
    support-email: support@shopcart.in

logging:
  level:
    root: INFO
    com.shopcart: INFO
